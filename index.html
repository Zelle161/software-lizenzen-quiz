<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz: Software, Lizenzen & Installation</title><style>:root{--bg:#0f1420;--c:#171e2e;--b:#2a3550;--t:#e8ecf5;--m:#9aa6c0;--a:#6c8cff;--a2:#a06cff;--ok:#1f9d63;--okb:#12382b;--bad:#e5484d;--badb:#3d1a1d}.l{--bg:#f3f5fb;--c:#fff;--b:#d9dff0;--t:#161c2c;--m:#5b6785;--okb:#dcf5e8;--badb:#fde3e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--b);padding:10px 14px;z-index:5}.w{max-width:760px;margin:auto}.r{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.05rem;margin:0;color:var(--a)}.pb{height:6px;background:var(--b);border-radius:9px;margin-top:8px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2))}#pt{font-size:.78rem;color:var(--m);margin-top:4px}main{max-width:760px;margin:auto;padding:12px 12px 110px}.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:16px;margin:14px 0}.tag{font-size:.7rem;padding:3px 9px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--a2));color:#fff}.n{font-size:.78rem;color:var(--m);text-transform:uppercase}h2{font-size:1.05rem;margin:6px 0 10px}label{display:flex;align-items:center;gap:12px;padding:14px;margin:8px 0;border:1.5px solid var(--b);border-radius:12px;cursor:pointer}label input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--a)}label.s{border-color:var(--a);background:rgba(108,140,255,.18)}label.ok{border-color:var(--ok);background:var(--okb)}label.bad{border-color:var(--bad);background:var(--badb)}label.miss{border:2px dashed var(--ok)}.ex{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--a);background:rgba(108,140,255,.1);border-radius:8px;font-size:.9rem;color:var(--m)}.done .ex{display:block}.done label{pointer-events:none}#res{display:none;text-align:center}.big{font-size:2rem;font-weight:800;color:var(--a)}.act{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--b);padding:10px 12px}.act div{max-width:760px;margin:auto;display:flex;gap:10px}button{font:inherit}.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--a),var(--a2));cursor:pointer}.btn.g{background:var(--c);color:var(--t);border:1px solid var(--b)}#th{background:var(--c);border:1px solid var(--b);color:var(--t);border-radius:10px;padding:6px 10px;cursor:pointer}</style></head><body><header><div class="w"><div class="r"><h1>🧠 Software, Lizenzen & Installation</h1><button id="th" onclick="tg()">🌙</button></div><div class="pb"><div id="bar"></div></div><div id="pt"></div></div></header><main><div id="qs"></div><section class="card" id="res"><div class="big" id="sc"></div><div id="msg"></div><p style="color:var(--m);font-size:.85rem">Grün = richtig, rot = falsch gewählt, gestrichelt = vergessen. Mehrfachauswahl zählt nur, wenn alles stimmt.</p></section></main><div class="act"><div><button class="btn" onclick="check()">Auswerten</button><button class="btn g" onclick="reset()">Neu mischen</button></div></div><noscript><p style="padding:14px">Bitte JavaScript aktivieren.</p></noscript><script>var D=[['Ein Betrieb hat 40 Mitarbeitende, doch nie arbeiten mehr als 10 gleichzeitig mit dem Programm. Welches Lizenzmodell spart am meisten?',['Concurrent-User-Lizenz (Floating)','Named-User-Lizenz','OEM-Lizenz','Public Domain'],[0],'Concurrent User begrenzt nur die gleichzeitigen Nutzer (auch Floating-/Netzwerklizenz).'],['Ein Kollege will den Windows-OEM-Key seines Firmenlaptops privat nutzen. Warum meist nicht erlaubt?',['OEM ist an die Hardware gebunden, mit der sie verkauft wurde','OEM ist immer Shareware','Windows ist Open Source','Der Key läuft nach 30 Tagen ab'],[0],'OEM: nur auf der Verkaufs-Hardware, Weitergabe nur mit ihr.'],['Welche Aussagen sind FALSCH?',['Jede kostenlose Software darf auch verändert und weitergegeben werden','Bei Open Source darf nur der Hersteller den Quellcode ändern','Freeware kann kommerzielle Nutzung verbieten','Windows und Microsoft Office sind Open Source'],[0,1,3],'Kostenlos ist nicht frei. Windows und Office sind proprietär.'],['Welche Zuordnungen passen laut Arbeitsblatt?',['VLC: Open Source','WinRAR: Shareware','Microsoft Office: Named User','LibreOffice: Shareware','Windows: Open Source'],[0,1,2],'LibreOffice ist Open Source, Windows proprietär.'],['Kostenlos, Quellcode geschlossen, Veränderung verboten. Welche Art?',['Freeware','Open Source','Public Domain','Concurrent User'],[0],'Freeware: Nutzung kostenlos, keine Veränderung.'],['Software läuft 30 Tage voll, danach sind Funktionen gesperrt, bis man kauft. Welche Art?',['Shareware','Public Domain','Freeware','OEM'],[0],'Shareware ist zeitlich/funktional eingeschränkt, z. B. WinRAR.'],['Welche Aussage trifft auf Donationware zu?',['Kostenlos nutzbar, Veränderung nur erlaubt, wenn sie auch Open Source ist','Nur auf dem Originalgerät nutzbar','Jede Änderung ist ohne Auflagen erlaubt','Nur namentlich registrierte Nutzer'],[0],'So steht es in der Tabelle des Arbeitsblatts.'],['Worin unterscheidet sich Public Domain von Freeware?',['Public Domain darf frei genutzt, verändert und weitergegeben werden; Freeware nicht veränderbar','Freeware ist kostenpflichtig','Public Domain ist an Hardware gebunden','Kein Unterschied'],[0],'Public Domain: ohne Einschränkungen.'],['Ein Programm fängt Fehleingaben ab und stellt sich nach Ausfall wieder her. Welches ISO-9126-Merkmal?',['Zuverlässigkeit','Funktionalität','Effizienz','Übertragbarkeit'],[0],'Zuverlässigkeit: stabil, fehlertolerant, wiederherstellbar.'],['Eine Anwendung lässt sich ohne große Anpassung auf Windows und Linux installieren. Welches Merkmal?',['Übertragbarkeit','Benutzbarkeit','Zuverlässigkeit','Änderbarkeit'],[0],'Übertragbarkeit = Portierbarkeit.'],['Fehler lassen sich schnell finden, neue Funktionen leicht einbauen. Welches Merkmal?',['Änderbarkeit','Effizienz','Funktionalität','Übertragbarkeit'],[0],'Änderbarkeit (Wartbarkeit).'],['Wenig Arbeitsspeicher, schnelle Reaktion. Welches Merkmal?',['Effizienz','Benutzbarkeit','Zuverlässigkeit','Funktionalität'],[0],'Effizienz: Zeit- und Ressourcenverhalten.'],['Ein Team zerlegt eine Anwendung in Login, Rechnungen, Export mit klaren Schnittstellen. Welches Prinzip?',['Modularisierung','Standardisierung','Mehrfachverwendung','Individualisierung'],[0],'Modularisierung: abgeschlossene Module mit Schnittstellen.'],['Die Login-Komponente aus Projekt A wird unverändert in Projekt B eingebaut. Welches Prinzip?',['Mehrfachverwendung','Strukturierung','Standardisierung','Modularisierung'],[0],'Mehrfachverwendung: Bausteine wiederverwenden.'],['Alle Entwickler nutzen einheitliche Namensregeln und Normen. Welches Prinzip?',['Standardisierung','Strukturierung','Mehrfachverwendung','Shareware'],[0],'Standardisierung: einheitliche Normen.'],['Welche Argumente sprechen eher für Kauf von Standardsoftware statt Eigenentwicklung?',['Sofort verfügbar','Meist geringere Anfangskosten','Perfekte Anpassung an jeden Spezialablauf','Volle Kontrolle über den Quellcode'],[0,1],'Maßanfertigung und Quellcode-Kontrolle sprechen für Eigenentwicklung.'],['Welche sind Systemprogramme?',['Windows','Linux','LibreOffice','VLC'],[0,1],'Betriebssysteme sind Systemprogramme.'],['Welche Eigenschaften werden UEFI im Unterschied zum BIOS zugeschrieben?',['Secure Boot','Unterstützung sehr großer Datenträger','Oft Mausbedienung','Prüft Hardware erst nach dem Betriebssystemstart'],[0,1,2],'Beide initialisieren Hardware vor dem Betriebssystem.'],['Lea startet mit Windows-Stick, der PC bootet aber von der Festplatte. Was tun?',['Im UEFI/BIOS den USB-Stick als Bootmedium festlegen','Office neu installieren','Den Stick im laufenden Windows doppelklicken','Festplatte ausbauen'],[0],'Die Firmware entscheidet über das Bootmedium.'],['Welche Wege führen ins BIOS/UEFI?',['Beim Start die angezeigte Taste drücken','Je nach Hersteller Entf, F2, F10, F12 oder Esc','Windows: erweiterte Starteinstellungen','Alt+Tab beim Start'],[0,1,2],'Alt+Tab ist nur der Fensterwechsel.'],['Bei welchen Vorgängen muss man typischerweise ins UEFI?',['Windows per USB-Stick neu installieren','Von einem Linux-Live-Stick booten','Office im laufenden Windows installieren','App aus dem App-Store laden'],[0,1],'Nur wenn die Bootreihenfolge geändert werden muss.'],['Ein Admin soll 50 PCs ohne USB-Sticks über das Netzwerk installieren. Welcher Weg?',['PXE','Blu-ray','Speicherkarte','CD-ROM'],[0],'PXE installiert über das Netzwerk.'],['Welche Zuordnungen Installationsweg/Kategorie stimmen?',['Speicherkarte: lokal','Package-Manager: Netzwerk','Blu-ray: lokal','PXE: lokal','App-Store: lokal'],[0,1,2],'PXE und App-Store sind Netzwerk-/Serverwege.'],['Welche Aussagen zu Concurrent User und Named User stimmen?',['Named User: nur namentlich registrierte Personen','Concurrent User heißt auch Floating-/Netzwerklizenz','Bei Concurrent User muss jede Person namentlich registriert sein','Named User: mehrere Personen dürfen ein Konto teilen'],[0,1],'Concurrent zählt gleichzeitige Nutzer, Named registrierte Personen.'],['Welche Aussage über Open Source ist korrekt?',['Quellcode zugänglich, Veränderung erlaubt, Weitergabe unter Beachtung der Lizenz','Quellcode geheim, nur Hersteller ändert','Nutzung nur auf Originalhardware','Nur namentlich registrierte Nutzer'],[0],'Beispiele: VLC, LibreOffice.'],['Software nur für eine Abteilung, genau auf deren Abläufe zugeschnitten. Welche Art?',['Individualsoftware','Standardsoftware','Public Domain','Shareware'],[0],'Wenige Nutzer, wenige Anwendungen: Individualsoftware.'],['Viele Praxen derselben Branche nutzen dieselbe Spezialsoftware für eine Aufgabe. Welche Art?',['Branchensoftware','Individualsoftware','Standardsoftware','OEM-Software'],[0],'Viele Nutzer, eine Anwendung: Branchensoftware.'],['Welche Aussagen zu Entwickeln oder Anschaffen stimmen?',['Hängt vor allem von betriebswirtschaftlichen Überlegungen ab','Alternative: neue Standard-, Branchen- oder Individualsoftware entwickeln','Alternative: bereits verfügbare Software einsetzen','Ausschließlich eine technische Frage'],[0,1,2],'Laut Arbeitsblatt gibt es diese zwei Alternativen.'],['Ein Programm erfüllt alle geforderten Aufgaben korrekt. Welches Merkmal?',['Funktionalität','Effizienz','Übertragbarkeit','Benutzbarkeit'],[0],'Funktionalität.'],['Neue Nutzer finden sich sofort zurecht. Welches Merkmal?',['Benutzbarkeit','Zuverlässigkeit','Änderbarkeit','Effizienz'],[0],'Benutzbarkeit.'],['Ein Problem wird in überschaubare, hierarchische Teile zerlegt. Welches Prinzip?',['Strukturierung','Mehrfachverwendung','Standardisierung','Shareware'],[0],'Strukturierung.'],['Wofür steht BIOS?',['Basic Input/Output System','Binary Installed Operating System','Boot Integrated Option Setup','Basic Internal Online Service'],[0],'Klassische Firmware älterer PCs.'],['Welche Aufgaben hat die Firmware beim Einschalten?',['Hardware (CPU, RAM, Grafik, Datenträger, Netzwerk) prüfen und initialisieren','Startfähigen Datenträger suchen und Betriebssystem starten','Office-Lizenz prüfen','Anwendungen aktualisieren'],[0,1],'Die Firmware läuft vor dem Betriebssystem.'],['Welches Merkmal ist ein zusätzliches Sicherheitsfeature von UEFI?',['Secure Boot','PXE','Package-Manager','OEM-Bindung'],[0],'UEFI bietet z. B. Secure Boot.'],['Welcher Installationsweg gehört zu Netzwerk/Fileserver?',['Package-Manager','USB-Stick','CD-ROM','Speicherkarte'],[0],'Lokal: Festplatte, USB, CD-ROM, Blu-ray, Speicherkarte.'],['Welche Aussagen zu Shareware stimmen?',['Zunächst kostenlos testbar','Zeitlich oder funktional eingeschränkt','Veränderung nicht erlaubt','Quellcode grundsätzlich offen'],[0,1,2],'Shareware ist kein Open Source.'],['Welche Aussagen zu Public Domain stimmen?',['Nutzung ohne klassische Lizenz möglich','Veränderung erlaubt','Weitergabe erlaubt','Nur nicht-kommerzielle Nutzung erlaubt'],[0,1,2],'Public Domain ist uneingeschränkt nutzbar.'],['Welche zählen zu kommerzieller/proprietärer Software?',['Windows','Microsoft Office','VLC','LibreOffice'],[0,1],'VLC und LibreOffice sind Open Source.'],['Ein Schüler ergänzt bei einem Programm mit offenem Quellcode eine Funktion und gibt es weiter. Was gilt?',['Bei Open Source erlaubt, Lizenz beachten','Immer verboten','Nur bei Shareware erlaubt','Nur mit OEM-Lizenz erlaubt'],[0],'Open Source erlaubt Änderung und Weitergabe.'],['Ein Autor gibt sein Programm ohne jede Bedingung frei. Welche Art?',['Public Domain','Freeware','Named User','Shareware'],[0],'Public Domain.'],['5 Lizenzen, jeweils fest auf einen Mitarbeiternamen. Welches Modell?',['Named User','Concurrent User','OEM','Public Domain'],[0],'Named User: namentlich registriert.'],['Welche Reihenfolge passt zu Leas Vorgehen?',['UEFI: USB als Bootmedium, Windows installieren, danach Office im laufenden System','Office installieren, UEFI öffnen, Windows installieren','Windows installieren, UEFI öffnen, Office-Stick booten','Nur Office installieren'],[0],'Office wird im laufenden Windows installiert.'],['Andere Bezeichnung für Concurrent-User-Lizenz?',['Floating- bzw. Netzwerklizenz','OEM-Lizenz','Donationware','Public-Domain-Lizenz'],[0],'Sie begrenzt gleichzeitige Nutzer.']];var cur=[];function sh(a){return a.map(function(v){return[Math.random(),v]}).sort(function(x,y){return x[0]-y[0]}).map(function(x){return x[1]})}function $(s){return document.querySelector(s)}function tg(){var l=document.body.classList.toggle('l');$('#th').textContent=l?'☀️':'🌙'}function build(){cur=sh(D.map(function(d,i){return{i:i,q:d[0],o:sh(d[1].map(function(t,k){return{t:t,r:d[2].indexOf(k)>-1}})),m:d[2].length>1,e:d[3]}}));var h='';cur.forEach(function(d,n){h+='<section class="card" id="c'+n+'"><div class="r"><span class="n">Frage '+(n+1)+'</span><span class="tag">'+(d.m?'Mehrfachauswahl':'Einzelauswahl')+'</span></div><h2>'+d.q+'</h2>';d.o.forEach(function(o,k){h+='<label id="l'+n+'_'+k+'"><input type="'+(d.m?'checkbox':'radio')+'" name="q'+n+'" onchange="prog()"><span>'+o.t+'</span></label>'});h+='<div class="ex">💡 '+d.e+'</div></section>'});$('#qs').innerHTML=h;$('#res').style.display='none';prog()}function sel(n){return cur[n].o.map(function(o,k){return document.querySelector('#l'+n+'_'+k+' input').checked})}function prog(){var c=0;cur.forEach(function(d,n){var s=sel(n);if(s.indexOf(true)>-1)c++;d.o.forEach(function(o,k){document.getElementById('l'+n+'_'+k).className=s[k]?'s':''})});$('#pt').textContent=c+' / '+cur.length+' beantwortet';$('#bar').style.width=(c/cur.length*100)+'%'}function check(){var p=0;cur.forEach(function(d,n){var s=sel(n),ok=true;d.o.forEach(function(o,k){var l=document.getElementById('l'+n+'_'+k);if(s[k]!==o.r)ok=false;l.className=o.r&&s[k]?'ok':s[k]?'bad':o.r?'miss':''});if(ok)p++;document.getElementById('c'+n).classList.add('done')});var pr=Math.round(p/cur.length*100);$('#sc').textContent=p+' / '+cur.length+' ('+pr+'%)';$('#msg').textContent=pr>=90?'Sehr gut! 🎉':pr>=75?'Gut gemacht!':pr>=50?'Noch etwas üben.':'Nochmal lernen.';$('#res').style.display='block';$('#res').scrollIntoView()}function reset(){build();scrollTo(0,0)}build();</script></body></html>
